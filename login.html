<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeStay Dorm - Đăng Nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">
        <div class="bg-blue-700 text-white p-10 text-center">
            <i class="fas fa-home text-6xl mb-4"></i>
            <h1 class="text-3xl font-bold">HomeStay Dorm</h1>
            <p class="mt-2 opacity-90">Ký túc xá tư nhân</p>
        </div>
        <div class="p-10">
            <h2 class="text-2xl font-semibold text-center mb-8">Đăng nhập hệ thống</h2>
            <input id="username" type="text" placeholder="Tên đăng nhập" value="sale01" 
                   class="w-full px-5 py-4 border rounded-2xl mb-4 focus:outline-none focus:border-blue-500">
            <input id="password" type="password" placeholder="Mật khẩu" value="123456" 
                   class="w-full px-5 py-4 border rounded-2xl mb-6 focus:outline-none focus:border-blue-500">
            <button onclick="login()" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-semibold text-lg">
                ĐĂNG NHẬP
            </button>
            <div class="mt-8 text-center text-sm text-gray-500">
                <p class="mb-3">Tài khoản demo:</p>
                <div class="grid grid-cols-3 gap-3 text-xs">
                    <div onclick="quickLogin('sale')" class="cursor-pointer bg-gray-100 p-3 rounded-xl">Kinh doanh</div>
                    <div onclick="quickLogin('accountant')" class="cursor-pointer bg-gray-100 p-3 rounded-xl">Kế toán</div>
                    <div onclick="quickLogin('manager')" class="cursor-pointer bg-gray-100 p-3 rounded-xl">Quản lý</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function login() {
            const user = document.getElementById('username').value.toLowerCase();
            if (user.includes('sale')) location.href = 'sales.html';
            else if (user.includes('account') || user.includes('ke')) location.href = 'accountant.html';
            else if (user.includes('manage') || user.includes('quan')) location.href = 'manager.html';
            else location.href = 'sales.html';
        }
        function quickLogin(role) {
            if (role === 'sale') location.href = 'sales.html';
            else if (role === 'accountant') location.href = 'accountant.html';
            else location.href = 'manager.html';
        }
    </script>
</body>
</html>
